name: Schema Refresh

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday at 06:00 UTC
  workflow_dispatch:       # allow manual trigger
    inputs:
      release_url:
        description: 'Blesta release zip URL (defaults to the BLESTA_RELEASE_URL repo variable)'
        required: false

jobs:
  refresh-schemas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      # source-docs.blesta.com stops at 5.13, so schemas are extracted from the
      # PHP source of a Blesta release. Download links carry a per-release ID
      # (see https://www.blesta.com/features/developers/), so the URL is
      # configured rather than derived from a version number.
      - name: Resolve release URL
        env:
          RELEASE_URL: ${{ inputs.release_url || vars.BLESTA_RELEASE_URL }}
        run: |
          if [ -z "$RELEASE_URL" ]; then
            echo "::error::Set the BLESTA_RELEASE_URL repo variable or pass release_url"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/blesta.zip" "$RELEASE_URL"

      - name: Run core schema extractor
        run: uv run python -m tools.extract_schema --source "$RUNNER_TEMP/blesta.zip"

      - name: Run plugin schema extractor
        run: uv run python -m tools.extract_plugin_schema --source "$RUNNER_TEMP/blesta.zip"

      - name: Open PR if schemas changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(schemas): automated weekly refresh"
          title: "chore(schemas): automated weekly schema refresh"
          body: |
            Automated schema refresh triggered by the weekly schedule.

            Both extraction tools were run against the configured Blesta release.
            Review the diff to confirm the changes are expected before merging.

            > ⚠️ Do **not** merge if credentials or personal data appear in the diff.
          branch: chore/schema-refresh-auto
          base: master
          delete-branch: true
          labels: schemas,automated
